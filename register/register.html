<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إنشاء حساب | ONE PIECE STORE</title>

<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="register.css">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

</head>

<body>

<div class="bg-blur blur1"></div>
<div class="bg-blur blur2"></div>

<header class="login-header">

<a href="../index.html" class="back-btn">
🏠 الرئيسية
</a>

<div class="logo">

<h1>🏴‍☠️ ONE PIECE</h1>

<span>STORE</span>

</div>

</header>

<section class="login-section">

<div class="login-card">

<h2>
إنشاء حساب
</h2>

<p>
أنشئ حسابك للاستفادة من جميع خدمات المتجر.
</p>

<form id="registerForm">

<div class="input-box">

<label>
👤 الاسم الكامل
</label>

<input
type="text"
id="name"
placeholder="اكتب اسمك">

</div>

<div class="input-box">

<label>
📱 رقم الهاتف
</label>

<input
type="tel"
id="phone"
placeholder="01xxxxxxxxx">

</div>

<div class="input-box">

<label>
🔒 كلمة المرور
</label>

<input
type="password"
id="password"
placeholder="أدخل كلمة المرور">

</div>

<div class="input-box">

<label>
🔐 تأكيد كلمة المرور
</label>

<input
type="password"
id="confirmPassword"
placeholder="أعد كتابة كلمة المرور">

</div>

<div class="input-box">

<label>
🏴‍☠️ سؤال الأمان
</label>

<select id="securityQuestion">

<option value="">
اختر سؤالاً من عالم One Piece
</option>

<option value="captain">
👑 من هو قائدك المفضل؟
</option>

<option value="crew">
⚔️ من أول فرد ستختاره في طاقمك؟
</option>

<option value="fruit">
🍈 ما هي فاكهة الشيطان التي تتمناها؟
</option>

<option value="dream">
⭐ ما هو حلمك مثل حلم لوفي؟
</option>

<option value="ship">
🚢 ماذا ستسمي سفينتك؟
</option>

<option value="island">
🏝️ ما هي جزيرتك المفضلة؟
</option>

<option value="character">
❤️ من هي شخصيتك المفضلة في One Piece؟
</option>

</select>

</div>

<div class="input-box">

<label>
✍️ الإجابة السرية
</label>

<input
type="text"
id="securityAnswer"
placeholder="اكتب إجابتك السرية">

</div>

<div class="options">

<label class="remember">

<input
type="checkbox"
id="agree">

<span>

أوافق على الشروط والأحكام

</span>

</label>

</div>

<button
type="submit"
class="login-btn">

🏴‍☠️ إنشاء الحساب

</button>

</form>

<div class="divider">

<span>
أو
</span>

</div>

<p class="register-text">

لديك حساب بالفعل؟

<a href="../login/login.html">

تسجيل الدخول

</a>

</p>

</div>

</section>

<footer class="login-footer">

<p>
© 2026 ONE PIECE STORE
</p>

</footer>

<script src="register.js"></script>

</body>
</html>
