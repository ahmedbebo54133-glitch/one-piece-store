<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملف القرصان - ONE PIECE STORE</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* بطاقة هُوية القرصان الفخمة */
        .pirate-card-wrapper {
            background: linear-gradient(145deg, #182026, #0e1318);
            border: 2px solid #ffd54f;
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 8px 25px rgba(255, 213, 79, 0.2);
            margin-bottom: 25px;
            overflow: hidden;
        }

        .pirate-card-wrapper::before {
            content: "☠️";
            position: absolute;
            top: -20px;
            left: -20px;
            font-size: 90px;
            opacity: 0.05;
            pointer-events: none;
        }

        .avatar-box {
            width: 85px;
            height: 85px;
            margin: 0 auto 12px auto;
            background: #232d38;
            border: 3px solid #ffd54f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            box-shadow: 0 0 15px rgba(255, 213, 79, 0.3);
        }

        .pirate-name {
            color: #ffd54f;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .pirate-phone {
            color: #8c9ba5;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .rank-badge {
            display: inline-block;
            background: linear-gradient(45deg, #ffd54f, #ff9800);
            color: #000;
            font-weight: bold;
            font-size: 13px;
            padding: 4px 14px;
            border-radius: 20px;
            box-shadow: 0 3px 8px rgba(255, 152, 0, 0.4);
        }

        /* صندوق الإحصائيات السريعة */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: #182026;
            border: 1px solid #2b3440;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .stat-number {
            color: #ffd54f;
            font-size: 20px;
            font-weight: bold;
            display: block;
        }

        .stat-label {
            color: #8c9ba5;
            font-size: 12px;
            margin-top: 4px;
        }

        /* أزرار التنقل الداخلي (Tabs) */
        .profile-nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .p-tab-btn {
            flex: 1;
            padding: 12px;
            background: #182026;
            border: 1px solid #2b3440;
            color: #a0aec0;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .p-tab-btn.active {
            background: #ffd54f;
            color: #000;
            border-color: #ffd54f;
            box-shadow: 0 4px 12px rgba(255, 213, 79, 0.25);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* قائمة سجل الشحنات المبتكرة */
        .history-card {
            background: #182026;
            border: 1px solid #2b3440;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .history-card:hover {
            transform: translateY(-2px);
            border-color: #ffd54f;
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .game-icon {
            font-size: 28px;
            background: #232d38;
            width: 45px;
            height: 45px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .order-status {
            display: inline-block;
            font-size: 11px;
            color: #4caf50;
            background: rgba(76, 175, 80, 0.15);
            padding: 2px 8px;
            border-radius: 6px;
            margin-top: 4px;
        }

        .btn-logout-alt {
            background: rgba(229, 57, 53, 0.1);
            color: #e53935;
            border: 1px solid #e53935;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }

        .btn-logout-alt:hover {
            background: #e53935;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="btn-back">‹ الرئيسية</a>
        <div class="logo">☠️</div>
        <h1>ONE PIECE STORE</h1>
        <p>بطاقة الحساب والخدمات</p>
    </header>

    <div class="container">

        <div class="pirate-card-wrapper">
            <div class="avatar-box">🏴‍☠️</div>
            <div class="pirate-name" id="profileName">...</div>
            <div class="pirate-phone" id="profilePhone">01xxxxxxxxx</div>
            <span class="rank-badge" id="pirateRank">كابتن الطاقم ⚓</span>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <span class="stat-number" id="totalOrdersCount">0</span>
                <span class="stat-label">عدد الكنوز والشحنات</span>
            </div>
            <div class="stat-box">
                <span class="stat-number" id="totalSpentAmount">0 ج.م</span>
                <span class="stat-label">إجمالي المعاملات</span>
            </div>
        </div>

        <div class="profile-nav-tabs">
            <button type="button" class="p-tab-btn active" onclick="switchProfileTab('history')">📜 سجل الشحنات</button>
            <button type="button" class="p-tab-btn" onclick="switchProfileTab('settings')">⚙️ الإعدادات</button>
        </div>

        <div id="tabHistory" class="tab-content active">
            <div id="historyList">
                <p style="text-align: center; color: #8c9ba5; padding: 20px;">جاري تحميل سجل الكنوز... 💎</p>
            </div>
        </div>

        <div id="tabSettings" class="tab-content">
            <div class="section-box" style="margin-bottom: 0;">
                <h2>🔐 تغيير كلمة السر</h2>
                <form onsubmit="handleChangePassword(event)">
                    <div class="input-group">
                        <label>كلمة السر القديمة:</label>
                        <input type="password" id="oldPass" placeholder="••••••••" required>
                    </div>

                    <div class="input-group">
                        <label>كلمة السر الجديدة:</label>
                        <input type="password" id="newPass" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-send">تحديث كلمة السر 🔄</button>
                </form>
            </div>
        </div>

        <button type="button" class="btn-logout-alt" onclick="handleLogout()">تسجيل الخروج من الحساب 🚪</button>

    </div>

    <footer>
        © 2026 ONE PIECE STORE
    </footer>

    <script src="profile.js"></script>
</body>
</html>
