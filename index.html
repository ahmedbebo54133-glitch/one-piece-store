<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONE PIECE STORE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">☠️</div>
        <h1>ONE PIECE STORE</h1>
        <p>اختر الخدمة المطلوبة</p>
    </header>

    <div class="container">

        <a id="accountCardLink" href="login.html" class="card">
            <div class="left">
                <div class="icon" id="accountCardIcon">👤</div>
                <div>
                    <h3 id="accountCardTitle">تسجيل الدخول / حساب جديد</h3>
                </div>
            </div>
        </a>

        <a href="pubg.html" class="card">
            <div class="left">
                <div class="icon">
                    <img src="pubg.png" alt="PUBG Mobile" class="icon-img">
                </div>
                <div>
                    <h3>شحن ببجي (PUBG Mobile)</h3>
                </div>
            </div>
        </a>

        <a href="ml.html" class="card">
            <div class="left">
                <div class="icon">
                    <img src="ml.png" alt="Mobile Legends" class="icon-img">
                </div>
                <div>
                    <h3>شحن Mobile Legends</h3>
                </div>
            </div>
        </a>

    </div>

    <section class="features">
        <div class="feature">
            <div>⚡</div>
            <span>تنفيذ سريع</span>
        </div>

        <div class="feature">
            <div>🔒</div>
            <span>دفع آمن</span>
        </div>

        <a href="https://wa.me/201202105198" target="_blank" class="feature support-btn">
            <div>💬</div>
            <span>دعم فني</span>
        </a>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            const cardLink = document.getElementById('accountCardLink');
            const cardTitle = document.getElementById('accountCardTitle');
            const cardIcon = document.getElementById('accountCardIcon');

            // لو العميل مسجل دخول، بنغير الرابط والاسم والأيقونة
            if (currentUser) {
                cardLink.href = "Profile.html";
                cardIcon.innerText = "🏴‍☠️";
                cardTitle.innerText = `الملف الشخصي (${currentUser.pirateName})`;
            } else {
                cardLink.href = "login.html";
                cardIcon.innerText = "👤";
                cardTitle.innerText = "تسجيل الدخول / حساب جديد";
            }
        });
    </script>

</body>
</html>
