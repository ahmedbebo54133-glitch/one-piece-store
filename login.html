<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول / إنشاء حساب - متجر One Piece</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tahoma', sans-serif; }
        body { 
            background: linear-gradient(135deg, #050814 0%, #0d1527 100%); 
            color: #f8fafc; direction: rtl; text-align: right; padding: 15px; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .auth-container { 
            width: 100%; max-width: 420px; 
            background: rgba(15, 23, 42, 0.95); 
            border: 1px solid rgba(245, 158, 11, 0.4); 
            border-radius: 16px; padding: 25px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(245, 158, 11, 0.15); 
        }
        
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 22px; color: #f59e0b; text-shadow: 0 0 10px rgba(245, 158, 11, 0.5); margin-bottom: 5px; }
        .header p { font-size: 13px; color: #94a3b8; }

        .tabs { 
            display: flex; background: #030712; border-radius: 10px; padding: 4px; margin-bottom: 20px; 
            border: 1px solid #1e293b;
        }
        .tab-btn { 
            flex: 1; padding: 10px; border: none; background: transparent; color: #94a3b8; 
            font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 13px;
        }
        .tab-btn.active { 
            background: linear-gradient(135deg, #f59e0b, #d97706); color: #070913; 
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #cbd5e1; font-size: 13px; margin-bottom: 6px; }
        .form-control { 
            width: 100%; padding: 11px 14px; border-radius: 8px; background: #030712; 
            border: 1px solid #334155; color: white; font-size: 14px; outline: none; transition: 0.3s;
        }
        .form-control:focus { border-color: #f59e0b; box-shadow: 0 0 8px rgba(245, 158, 11, 0.3); }

        .submit-btn { 
            width: 100%; background: linear-gradient(135deg, #10b981, #047857); color: white; 
            padding: 12px; border-radius: 10px; border: none; font-size: 15px; font-weight: bold; 
            cursor: pointer; transition: 0.3s; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); margin-top: 10px;
        }
        .submit-btn:hover { background: linear-gradient(135deg, #059669, #065f46); transform: translateY(-2px); }

        .back-home { 
            display: block; text-align: center; margin-top: 15px; color: #f59e0b; 
            text-decoration: none; font-size: 13px; font-weight: bold; transition: 0.3s;
        }
        .back-home:hover { text-decoration: underline; color: #fbbf24; }

        .forgot-pass-link {
            display: block; text-align: center; margin-top: 12px; color: #94a3b8;
            font-size: 12px; text-decoration: none; transition: 0.3s;
        }
        .forgot-pass-link:hover { color: #f59e0b; text-decoration: underline; }

        .form-box { display: none; }
        .form-box.active { display: block; }
        
        .alert-msg { 
            display: none; padding: 10px; border-radius: 8px; font-size: 12px; 
            text-align: center; margin-bottom: 15px; font-weight: bold;
        }
        .alert-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; }
        .alert-success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #6ee7b7; }

        /* Modal Style */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); z-index: 1000;
            justify-content: center; align-items: center; padding: 15px;
        }
        .modal-card {
            background: #0f172a; border: 2px solid #f59e0b; border-radius: 16px;
            padding: 25px; width: 100%; max-width: 400px; text-align: right;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.3);
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="header">
        <h1>🏴‍☠️ متجر One Piece</h1>
        <p>قم بإنشاء حساب أو تسجيل الدخول لمتابعة طلبياتك ونقاط Belly</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="loginTabBtn" onclick="switchTab('login')">تسجيل الدخول</button>
        <button class="tab-btn" id="registerTabBtn" onclick="switchTab('register')">إنشاء حساب جديد</button>
    </div>

    <div id="alertBox" class="alert-msg"></div>

    <form id="loginForm" class="form-box active" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>رقم الهاتف:</label>
            <input type="tel" id="loginIdentifier" class="form-control" placeholder="أدخل رقم هاتفك (مثال: 01012345678)" required>
        </div>
        <div class="form-group">
            <label>كلمة المرور:</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="أدخل كلمة المرور" required>
        </div>
        <button type="submit" class="submit-btn">🔑 تسجيل الدخول</button>
        
        <a href="#" class="forgot-pass-link" onclick="openResetModal(event)">🔑 نسيت كلمة المرور؟</a>
    </form>

    <form id="registerForm" class="form-box" onsubmit="handleRegister(event)">
        <div class="form-group">
            <label>الاسم بالكامل: <span style="color:#ef4444">*</span></label>
            <input type="text" id="regName" class="form-control" placeholder="مثال: أحمد محمد" required>
        </div>
        <div class="form-group">
            <label>رقم الهاتف: <span style="color:#ef4444">*</span></label>
            <input type="tel" id="regPhone" class="form-control" placeholder="مثال: 01012345678" required>
        </div>
        <div class="form-group">
            <label>البريد الإلكتروني (اختياري):</label>
            <input type="email" id="regEmail" class="form-control" placeholder="name@example.com">
        </div>
        <div class="form-group">
            <label>Player ID الافتراضي (اختياري):</label>
            <input type="text" id="regDefaultId" class="form-control" placeholder="أدخل الآيدي الخاص بك في ببجي">
        </div>

        <div class="form-group">
            <label>سؤال الأمان للاستعادة: <span style="color:#ef4444">*</span></label>
            <select id="regSecurityQuestion" class="form-control" required style="background: #030712; color: white;">
                <option value="" disabled selected>اختر سؤال الأمان...</option>
                <option value="q1">ما هو اسم صديقك المقرب؟</option>
                <option value="q2">ما هي مدينتك المفضلة؟</option>
                <option value="q3">ما هو اسم شخصيتك المفضلة في ون بيس؟</option>
            </select>
        </div>

        <div class="form-group">
            <label>إجابة سؤال الأمان: <span style="color:#ef4444">*</span></label>
            <input type="text" id="regSecurityAnswer" class="form-control" placeholder="أدخل إجابتك الخاصة" required>
        </div>

        <div class="form-group">
            <label>كلمة المرور: <span style="color:#ef4444">*</span></label>
            <input type="password" id="regPassword" class="form-control" placeholder="أنشئ كلمة مرور قوية" required minlength="6">
        </div>

        <button type="submit" class="submit-btn">🚀 إنشاء حساب جديد</button>
    </form>

    <a href="index.html" class="back-home">⬅ العودة إلى الصفحة الرئيسية</a>
</div>

<div id="resetModal" class="modal-overlay">
    <div class="modal-card">
        <h3 style="color: #f59e0b; margin-bottom: 15px; font-size: 18px; text-align: center;">🔑 استعادة كلمة المرور</h3>
        
        <div id="resetStep1">
            <div class="form-group">
                <label>رقم الهاتف المسجل:</label>
                <input type="tel" id="resetPhoneInput" class="form-control" placeholder="أدخل رقم هاتفك">
            </div>
            <button onclick="checkSecurityQuestion()" class="submit-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #000;">متابعة</button>
        </div>

        <div id="resetStep2" style="display: none;">
            <p id="displayQuestionText" style="color: #f59e0b; font-size: 13px; margin-bottom: 12px; font-weight: bold; text-align: center;"></p>
            
            <div class="form-group">
                <label>إجابة سؤال الأمان:</label>
                <input type="text" id="resetAnswerInput" class="form-control" placeholder="أدخل إجابتك">
            </div>

            <div class="form-group">
                <label>كلمة المرور الجديدة:</label>
                <input type="password" id="newPassInput" class="form-control" placeholder="كلمة المرور الجديدة (6 أحرف على الأقل)">
            </div>

            <button onclick="handlePasswordResetWithAnswer()" class="submit-btn">✅ تحديث كلمة المرور</button>
        </div>

        <button onclick="closeResetModal()" style="width: 100%; padding: 8px; background: #ef4444; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;">إلغاء</button>
    </div>
</div>

<script>
    // 👑 بيانات الأدمن الرسمية للمتجر
    const ADMIN_DATA = {
        phone: '01140597833',
        name: 'Luffy',
        password: 'Mohamed#Luffy_54133',
        role: 'admin'
    };

    // خريطة الأسئلة
    const securityQuestionsMap = {
        q1: "ما هو اسم صديقك المقرب؟",
        q2: "ما هي مدينتك المفضلة؟",
        q3: "ما هو اسم شخصيتك المفضلة في ون بيس؟"
    };

    // 📦 محرك التعامل مع قاعدة البيانات
    const DB = {
        getUsers: () => JSON.parse(localStorage.getItem('app_users_db')) || {},
        saveUsers: (users) => localStorage.setItem('app_users_db', JSON.stringify(users))
    };

    // 🔒 تشفير كلمة المرور (Base64)
    function hashPassword(pass) {
        return btoa(pass);
    }

    // 🔓 مطابقة كلمة المرور
    function verifyPassword(inputPass, storedPass) {
        return hashPassword(inputPass) === storedPass || inputPass === storedPass;
    }

    function switchTab(tab) {
        document.getElementById('alertBox').style.display = 'none';
        if (tab === 'login') {
            document.getElementById('loginTabBtn').classList.add('active');
            document.getElementById('registerTabBtn').classList.remove('active');
            document.getElementById('loginForm').classList.add('active');
            document.getElementById('registerForm').classList.remove('active');
        } else {
            document.getElementById('registerTabBtn').classList.add('active');
            document.getElementById('loginTabBtn').classList.remove('active');
            document.getElementById('registerForm').classList.add('active');
            document.getElementById('loginForm').classList.remove('active');
        }
    }

    function showAlert(msg, type) {
        const box = document.getElementById('alertBox');
        box.innerText = msg;
        box.className = 'alert-msg ' + (type === 'success' ? 'alert-success' : 'alert-danger');
        box.style.display = 'block';
    }

    // --- وظائف استعادة كلمة المرور بسؤال الأمان ---
    function openResetModal(e) {
        if(e) e.preventDefault();
        document.getElementById('resetModal').style.display = 'flex';
        document.getElementById('resetStep1').style.display = 'block';
        document.getElementById('resetStep2').style.display = 'none';
        document.getElementById('resetPhoneInput').value = '';
    }

    function closeResetModal() {
        document.getElementById('resetModal').style.display = 'none';
    }

    function checkSecurityQuestion() {
        const phone = document.getElementById('resetPhoneInput').value.trim();
        const users = DB.getUsers();

        if (!phone) {
            alert('⚠️ يرجى إدخال رقم الهاتف أولاً!');
            return;
        }

        if (!users[phone]) {
            alert('❌ رقم الهاتف هذا غير مسجل لدينا!');
            return;
        }

        const user = users[phone];
        
        if (!user.securityQuestion || !user.securityAnswer) {
            alert('⚠️ هذا الحساب قديم ولا يحتوي على سؤال أمان.');
            return;
        }

        const questionText = securityQuestionsMap[user.securityQuestion] || "سؤال الأمان";
        document.getElementById('displayQuestionText').innerText = `❓ ${questionText}`;

        document.getElementById('resetStep1').style.display = 'none';
        document.getElementById('resetStep2').style.display = 'block';
    }

    function handlePasswordResetWithAnswer() {
        const phone = document.getElementById('resetPhoneInput').value.trim();
        const answerInput = document.getElementById('resetAnswerInput').value.trim().toLowerCase();
        const newPass = document.getElementById('newPassInput').value.trim();

        let users = DB.getUsers();
        const user = users[phone];

        if (answerInput !== user.securityAnswer.toLowerCase()) {
            alert('❌ إجابة سؤال الأمان غير صحيحة!');
            return;
        }

        if (newPass.length < 6) {
            alert('⚠️ يجب أن تكون كلمة المرور 6 أحرف/أرقام على الأقل!');
            return;
        }

        user.password = hashPassword(newPass);
        DB.saveUsers(users);

        alert('✅ تم تغيير كلمة المرور بنجاح! يمكنك الآن تسجيل الدخول.');
        closeResetModal();
    }

    // 🔑 معالجة تسجيل الدخول
    function handleLogin(e) {
        e.preventDefault();
        const phoneInput = document.getElementById('loginIdentifier').value.trim();
        const passwordInput = document.getElementById('loginPassword').value.trim();

        if ((phoneInput === ADMIN_DATA.phone || phoneInput.toLowerCase() === ADMIN_DATA.name.toLowerCase()) && passwordInput === ADMIN_DATA.password) {
            showAlert('👑 أهلاً بك يا كابتن Luffy! جاري فتح خيارات الأدمن...', 'success');
            
            let users = DB.getUsers();
            if (!users[ADMIN_DATA.phone]) {
                users[ADMIN_DATA.phone] = {
                    phone: ADMIN_DATA.phone,
                    name: ADMIN_DATA.name,
                    password: hashPassword(ADMIN_DATA.password),
                    email: 'admin@onepiece.com',
                    defaultPlayerId: 'ADMIN',
                    bellyBalance: 99999,
                    totalSpentEgp: 0,
                    orders: [],
                    rewardsHistory: [],
                    role: 'admin',
                    createdAt: new Date().toLocaleDateString('ar-EG')
                };
                DB.saveUsers(users);
            }

            localStorage.setItem('currentUserSession', JSON.stringify({ phone: ADMIN_DATA.phone }));
            sessionStorage.setItem('isAdminLoggedIn', 'true');

            setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            return;
        }

        const users = DB.getUsers();
        const user = users[phoneInput];

        if (user && verifyPassword(passwordInput, user.password)) {
            showAlert(`✅ تم تسجيل الدخول بنجاح! أهلاً بك يا ${user.name}`, 'success');
            
            localStorage.setItem('currentUserSession', JSON.stringify({ phone: user.phone }));

            setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        } else {
            showAlert('❌ رقم الهاتف أو كلمة المرور غير صحيحة!', 'danger');
        }
    }

    // 🚀 إنشاء حساب جديد
    function handleRegister(e) {
        e.preventDefault();
        const name = document.getElementById('regName').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const defaultPlayerId = document.getElementById('regDefaultId').value.trim();
        const securityQuestion = document.getElementById('regSecurityQuestion').value;
        const securityAnswer = document.getElementById('regSecurityAnswer').value.trim();
        const password = document.getElementById('regPassword').value.trim();

        if (phone === ADMIN_DATA.phone) {
            showAlert('❌ هذا الرقم محجوز للأدمن، يمكنك تسجيل الدخول مباشرة!', 'danger');
            return;
        }

        const users = DB.getUsers();

        if (users[phone]) {
            showAlert('❌ رقم الهاتف هذا مسجل بالفعل! يمكنك تسجيل الدخول.', 'danger');
            return;
        }

        users[phone] = {
            phone: phone,
            name: name,
            email: email || null,
            password: hashPassword(password),
            securityQuestion: securityQuestion,
            securityAnswer: securityAnswer,
            defaultPlayerId: defaultPlayerId || 'غير محدد',
            bellyBalance: 0,
            totalSpentEgp: 0,
            orders: [],
            rewardsHistory: [],
            role: 'user',
            createdAt: new Date().toLocaleDateString('ar-EG')
        };

        DB.saveUsers(users);

        showAlert('🎉 تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.', 'success');
        setTimeout(() => { switchTab('login'); }, 1200);
    }
</script>

</body>
</html>
