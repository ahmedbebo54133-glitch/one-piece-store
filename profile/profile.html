<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>حسابي | ONE PIECE STORE</title>

  <link rel="stylesheet" href="../style.css">

  <link rel="stylesheet" href="profile.css">

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

</head>


<body>

  <header class="profile-header">

    <a href="../index.html" class="back-btn">
      🏠 الرئيسية
    </a>

    <div class="logo">
      <h1>🏴‍☠️ ONE PIECE</h1>
      <span>STORE</span>
    </div>

  </header>

  <section class="profile-section">

    <div class="profile-card">

      <div class="avatar">
        👤
      </div>

      <h2 id="userName">
        اسم المستخدم
      </h2>

      <p class="welcome">
        مرحباً بك في حسابك
      </p>

      <div class="info-box">
        <div>
          <span>📱 رقم الهاتف</span>
          <strong id="userPhone">---</strong>
        </div>
      </div>

      <div class="orders-box">
        <div class="orders-header">
          <h3>📦 سجل الشحنات</h3>
          <button id="deleteOrders" class="delete-orders">🗑 حذف السجل</button>
        </div>

        <div id="ordersList">
          </div>
      </div>

      <div class="settings-box">
        <h3>⚙️ الإعدادات</h3>
        <button id="changePassword">🔐 تغيير كلمة المرور</button>
        <button id="logout" class="logout-btn">🚪 تسجيل الخروج</button>
      </div>

    </div>

  </section>

  <div class="password-box" id="passwordBox">

    <div class="password-card">
      <h3>🔐 تغيير كلمة المرور</h3>
      <input type="password" id="newPassword" placeholder="كلمة المرور الجديدة">
      <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور">

      <button id="savePassword">حفظ التغيير</button>
      <button id="closePassword">إغلاق</button>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>

      firebase.initializeApp(firebaseConfig);

  <script src="profile.js"></script>

</body>
